name: Build AETHER Android APK with Native Widget

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Assemble Crash-Proof Android Project
      run: |
        # Clean potential duplicate files from web uploads
        rm -f "build.gradle (1).kts" "index (2).html" "build-apk.yml"

        # Directory structure
        mkdir -p app/src/main/java/com/aether/monitor/widget
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets/www

        # Base resources from root
        cp bg_widget_oled.xml ic_concentric_logo.xml app/src/main/res/drawable/ || true
        cp colors.xml strings.xml app/src/main/res/values/ || true
        cp index.html app/src/main/assets/www/ || true

        # 1. Crash-Proof MainActivity with Native Android AppWidget Pinning Bridge
        cat << 'EOF' > app/src/main/java/com/aether/monitor/MainActivity.kt
        package com.aether.monitor

        import android.annotation.SuppressLint
        import android.app.Activity
        import android.appwidget.AppWidgetManager
        import android.content.ComponentName
        import android.content.Context
        import android.content.Intent
        import android.graphics.Color
        import android.os.Build
        import android.os.Bundle
        import android.view.Window
        import android.view.WindowManager
        import android.webkit.JavascriptInterface
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.Toast
        import com.aether.monitor.widget.AetherWidgetProvider

        class MainActivity : Activity() {
            private lateinit var webView: WebView

            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                requestWindowFeature(Window.FEATURE_NO_TITLE)
                window.setFlags(
                    WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                    WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                )
                window.statusBarColor = Color.BLACK
                window.navigationBarColor = Color.BLACK

                webView = WebView(this).apply {
                    setBackgroundColor(Color.BLACK)
                }
                setContentView(webView)

                with(webView.settings) {
                    javaScriptEnabled = true
                    domStorageEnabled = true
                    databaseEnabled = true
                    allowFileAccess = true
                    allowContentAccess = true
                    mediaPlaybackRequiresUserGesture = false
                    cacheMode = WebSettings.LOAD_DEFAULT
                    useWideViewPort = true
                    loadWithOverviewMode = true
                }

                webView.addJavascriptInterface(AndroidBridge(this), "AndroidBridge")
                webView.webViewClient = WebViewClient()
                webView.webChromeClient = WebChromeClient()

                loadFromIntent(intent)
            }

            override fun onNewIntent(intent: Intent?) {
                super.onNewIntent(intent)
                if (intent != null) {
                    setIntent(intent)
                    loadFromIntent(intent)
                }
            }

            private fun loadFromIntent(intent: Intent?) {
                val zenGameId = intent?.getIntExtra("zen_game_id", 0) ?: 0
                if (zenGameId > 0) {
                    webView.loadUrl("file:///android_asset/www/index.html?zen=$zenGameId&fullscreen=1")
                } else {
                    webView.loadUrl("file:///android_asset/www/index.html")
                }
            }

            inner class AndroidBridge(private val ctx: Context) {
                @JavascriptInterface
                fun pinActiveGame(gameId: Int, gameName: String) {
                    runOnUiThread {
                        try {
                            // 1. Save active game to SharedPreferences for the Native Widget
                            val prefs = ctx.getSharedPreferences("aether_prefs", Context.MODE_PRIVATE)
                            prefs.edit()
                                .putInt("pinned_zen_id", gameId)
                                .putString("pinned_zen_name", gameName)
                                .apply()

                            // 2. Refresh active AETHER widgets on launcher desktop
                            val appWidgetManager = AppWidgetManager.getInstance(ctx)
                            val component = ComponentName(ctx, AetherWidgetProvider::class.java)
                            val ids = appWidgetManager.getAppWidgetIds(component)
                            for (id in ids) {
                                AetherWidgetProvider.updateAppWidget(ctx, appWidgetManager, id)
                            }

                            // 3. Request native Android 8.0+ Home Screen Widget Pinning
                            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                if (appWidgetManager.isRequestPinAppWidgetSupported) {
                                    appWidgetManager.requestPinAppWidget(component, null, null)
                                    Toast.makeText(
                                        ctx,
                                        "Добавление виджета игры #$gameId на рабочий стол...",
                                        Toast.LENGTH_SHORT
                                    ).show()
                                } else {
                                    Toast.makeText(
                                        ctx,
                                        "Виджет обновлен! Зажмите пустой экран -> Виджеты -> AETHER",
                                        Toast.LENGTH_LONG
                                    ).show()
                                }
                            } else {
                                Toast.makeText(
                                    ctx,
                                    "Виджет AETHER обновлен с игрой #$gameId!",
                                    Toast.LENGTH_LONG
                                ).show()
                            }
                        } catch (e: Exception) {
                            e.printStackTrace()
                        }
                    }
                }
            }

            override fun onBackPressed() {
                if (::webView.isInitialized && webView.canGoBack()) {
                    webView.goBack()
                } else {
                    super.onBackPressed()
                }
            }
        }
        EOF

        # 2. Native Telemetry + Zen Game Widget Layout
        cat << 'EOF' > app/src/main/res/layout/widget_telemetry.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/widget_root"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="@drawable/bg_widget_oled"
            android:orientation="vertical"
            android:padding="16dp">

            <RelativeLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content">

                <LinearLayout
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_alignParentStart="true"
                    android:layout_centerVertical="true"
                    android:gravity="center_vertical"
                    android:orientation="horizontal">

                    <ImageView
                        android:layout_width="18dp"
                        android:layout_height="18dp"
                        android:src="@drawable/ic_concentric_logo" />

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:layout_marginStart="8dp"
                        android:fontFamily="monospace"
                        android:text="AETHER // SYS.01"
                        android:textColor="@color/gray_light"
                        android:textSize="10sp" />
                </LinearLayout>

                <TextView
                    android:id="@+id/widget_clock"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_alignParentEnd="true"
                    android:fontFamily="monospace"
                    android:text="00:00"
                    android:textColor="@color/white"
                    android:textSize="22sp"
                    android:textStyle="bold" />
            </RelativeLayout>

            <!-- 1px Thin Divider -->
            <ImageView
                android:layout_width="match_parent"
                android:layout_height="1dp"
                android:layout_marginTop="8dp"
                android:layout_marginBottom="10dp"
                android:background="@color/border_dark" />

            <!-- Telemetry Metrics Grid -->
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:baselineAligned="false"
                android:orientation="horizontal">

                <LinearLayout
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:orientation="vertical">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="BATTERY"
                        android:textColor="@color/gray_light"
                        android:textSize="9sp" />

                    <TextView
                        android:id="@+id/widget_batt_val"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="--%"
                        android:textColor="@color/white"
                        android:textSize="17sp"
                        android:textStyle="bold" />

                    <TextView
                        android:id="@+id/widget_batt_sub"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="[BATTERY]"
                        android:textColor="@color/gray_dim"
                        android:textSize="8sp" />
                </LinearLayout>

                <LinearLayout
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:orientation="vertical">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="SYSTEM RAM"
                        android:textColor="@color/gray_light"
                        android:textSize="9sp" />

                    <TextView
                        android:id="@+id/widget_ram_val"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="58%"
                        android:textColor="@color/white"
                        android:textSize="17sp"
                        android:textStyle="bold" />

                    <TextView
                        android:id="@+id/widget_ram_sub"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="7.0 / 12 GB"
                        android:textColor="@color/gray_dim"
                        android:textSize="8sp" />
                </LinearLayout>

                <LinearLayout
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:orientation="vertical">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="NETWORK"
                        android:textColor="@color/gray_light"
                        android:textSize="9sp" />

                    <TextView
                        android:id="@+id/widget_net_val"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="5G-NR"
                        android:textColor="@color/white"
                        android:textSize="17sp"
                        android:textStyle="bold" />

                    <TextView
                        android:id="@+id/widget_net_sub"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:fontFamily="monospace"
                        android:text="STABLE"
                        android:textColor="@color/gray_dim"
                        android:textSize="8sp" />
                </LinearLayout>

            </LinearLayout>

            <!-- Zen Game Active Launcher Bar -->
            <TextView
                android:id="@+id/widget_footer"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="10dp"
                android:fontFamily="monospace"
                android:text="▶ ZEN #14: SOLAR SYSTEM [ИГРАТЬ]"
                android:textColor="@color/white"
                android:textSize="9sp" />
        </LinearLayout>
        EOF

        # 3. OLED Themes
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AetherOLED" parent="@android:style/Theme.NoTitleBar.Fullscreen">
                <item name="android:windowBackground">@color/oled_black</item>
                <item name="android:colorBackground">@color/oled_black</item>
                <item name="android:statusBarColor">@color/oled_black</item>
                <item name="android:navigationBarColor">@color/oled_black</item>
            </style>
        </resources>
        EOF

        # 4. Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_concentric_logo"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AetherOLED">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:theme="@style/Theme.AetherOLED">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <receiver
                    android:name=".widget.AetherWidgetProvider"
                    android:exported="true"
                    android:label="@string/widget_name">
                    <intent-filter>
                        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                        <action android:name="android.intent.action.BATTERY_CHANGED" />
                    </intent-filter>
                    <meta-data
                        android:name="android.appwidget.provider"
                        android:resource="@xml/widget_telemetry_info" />
                </receiver>
            </application>
        </manifest>
        EOF

        # 5. Widget Provider Metadata
        cat << 'EOF' > app/src/main/res/xml/widget_telemetry_info.xml
        <?xml version="1.0" encoding="utf-8"?>
        <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/widget_description"
            android:initialLayout="@layout/widget_telemetry"
            android:minWidth="250dp"
            android:minHeight="110dp"
            android:targetCellWidth="4"
            android:targetCellHeight="2"
            android:previewLayout="@layout/widget_telemetry"
            android:resizeMode="horizontal|vertical"
            android:updatePeriodMillis="1800000"
            android:widgetCategory="home_screen" />
        EOF

        # 6. Widget Provider with Zen Game Pinning & Telemetry
        cat << 'EOF' > app/src/main/java/com/aether/monitor/widget/AetherWidgetProvider.kt
        package com.aether.monitor.widget

        import android.app.ActivityManager
        import android.app.PendingIntent
        import android.appwidget.AppWidgetManager
        import android.appwidget.AppWidgetProvider
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.net.ConnectivityManager
        import android.net.NetworkCapabilities
        import android.os.BatteryManager
        import android.widget.RemoteViews
        import com.aether.monitor.MainActivity
        import com.aether.monitor.R
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale

        class AetherWidgetProvider : AppWidgetProvider() {
            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                for (id in appWidgetIds) {
                    try { updateAppWidget(context, appWidgetManager, id) } catch (e: Exception) {}
                }
            }

            override fun onReceive(context: Context, intent: Intent) {
                super.onReceive(context, intent)
                try {
                    val mgr = AppWidgetManager.getInstance(context)
                    val ids = mgr.getAppWidgetIds(android.content.ComponentName(context, AetherWidgetProvider::class.java))
                    for (id in ids) { updateAppWidget(context, mgr, id) }
                } catch (e: Exception) {}
            }

            companion object {
                fun updateAppWidget(context: Context, mgr: AppWidgetManager, id: Int) {
                    val views = RemoteViews(context.packageName, R.layout.widget_telemetry)

                    // 1. Digital Clock
                    try {
                        val sdf = SimpleDateFormat("HH:mm", Locale.getDefault())
                        views.setTextViewText(R.id.widget_clock, sdf.format(Date()))
                    } catch (e: Exception) {}

                    // 2. Battery Telemetry
                    try {
                        val filter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                        val bIntent = context.applicationContext.registerReceiver(null, filter)
                        val lvl = bIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: 85
                        val scale = bIntent?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: 100
                        val status = bIntent?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                        val chg = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                        val pct = if (scale > 0) (lvl * 100 / scale) else 85
                        views.setTextViewText(R.id.widget_batt_val, "$pct%")
                        views.setTextViewText(R.id.widget_batt_sub, if (chg) "[CHARGING]" else "[BATTERY]")
                    } catch (e: Exception) {
                        views.setTextViewText(R.id.widget_batt_val, "85%")
                        views.setTextViewText(R.id.widget_batt_sub, "[BATTERY]")
                    }

                    // 3. RAM Memory
                    try {
                        val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                        val mi = ActivityManager.MemoryInfo()
                        am.getMemoryInfo(mi)
                        val total = mi.totalMem.toDouble() / (1024 * 1024 * 1024)
                        val avail = mi.availMem.toDouble() / (1024 * 1024 * 1024)
                        val used = total - avail
                        val pct = Math.round((used / total) * 100).toInt()
                        views.setTextViewText(R.id.widget_ram_val, "$pct%")
                        views.setTextViewText(R.id.widget_ram_sub, String.format(Locale.US, "%.1f / %.0f GB", used, total))
                    } catch (e: Exception) {
                        views.setTextViewText(R.id.widget_ram_val, "58%")
                        views.setTextViewText(R.id.widget_ram_sub, "7.0 / 12 GB")
                    }

                    // 4. Network Status
                    try {
                        val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                        val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                        val label = when {
                            caps == null -> "OFFLINE"
                            caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "WIFI-6"
                            caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) -> "5G-NR"
                            else -> "ACTIVE"
                        }
                        views.setTextViewText(R.id.widget_net_val, label)
                        views.setTextViewText(R.id.widget_net_sub, if (caps != null) "ONLINE" else "DISCONN")
                    } catch (e: Exception) {
                        views.setTextViewText(R.id.widget_net_val, "5G-NR")
                        views.setTextViewText(R.id.widget_net_sub, "ONLINE")
                    }

                    // 5. Active Pinned Zen Game & Instant Launcher Click Intent
                    try {
                        val prefs = context.getSharedPreferences("aether_prefs", Context.MODE_PRIVATE)
                        val pinnedZenId = prefs.getInt("pinned_zen_id", 14)
                        val pinnedZenName = prefs.getString("pinned_zen_name", "Solar System Gravity")

                        views.setTextViewText(
                            R.id.widget_footer,
                            "▶ ZEN #${String.format("%02d", pinnedZenId)}: ${pinnedZenName?.uppercase()} [ИГРАТЬ]"
                        )

                        val intent = Intent(context, MainActivity::class.java).apply {
                            flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                            putExtra("zen_game_id", pinnedZenId)
                        }
                        val pi = PendingIntent.getActivity(
                            context,
                            pinnedZenId,
                            intent,
                            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                        )
                        views.setOnClickPendingIntent(R.id.widget_root, pi)
                    } catch (e: Exception) {}

                    mgr.updateAppWidget(id, views)
                }
            }
        }
        EOF

        # 7. Gradle Configuration
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "AetherMonitor"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.aether.monitor"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.aether.monitor"
                minSdk = 26
                targetSdk = 34
                versionCode = 3
                versionName = "1.0.2"
            }

            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions { jvmTarget = "1.8" }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.webkit:webkit:1.10.0")
        }
        EOF

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle 8.5
      run: |
        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew

    - name: Build Android APK
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AETHER-OLED-Widget-APK
        path: app/build/outputs/apk/debug/app-debug.apk
