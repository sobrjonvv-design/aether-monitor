name: Build AETHER Android APK with Native Widget

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Assemble Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/aether/monitor/widget
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets/www

        # Раскладка файлов в нативную структуру Android
        cp MainActivity.kt app/src/main/java/com/aether/monitor/ || true
        cp AetherWidgetProvider.kt app/src/main/java/com/aether/monitor/widget/ || true
        cp AndroidManifest.xml app/src/main/ || true
        cp widget_telemetry.xml app/src/main/res/layout/ || true
        cp widget_telemetry_info.xml app/src/main/res/xml/ || true
        cp bg_widget_oled.xml ic_concentric_logo.xml icon-192.png app/src/main/res/drawable/ || true
        cp colors.xml strings.xml themes.xml app/src/main/res/values/ || true
        cp index.html app/src/main/assets/www/ || true

        # Создание файла settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AetherMonitor"
        include(":app")
        EOF

        # Создание файла build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # Создание gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official
        EOF

        # Конфигурация модуля app
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.aether.monitor"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.aether.monitor"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.webkit:webkit:1.10.0")
        }
        EOF

    - name: Build Android APK
      run: |
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AETHER-OLED-Widget-APK
        path: app/build/outputs/apk/debug/app-debug.apk
