name: Build AETHER Android APK with Native Widget

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Assemble Crash-Proof Android Project
      run: |
        # Clean duplicate files from web uploads if any
        rm -f "build.gradle (1).kts" "index (2).html" "build-apk.yml"

        # Directory structure
        mkdir -p app/src/main/java/com/aether/monitor/widget
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets/www

        # Copy uploaded files from root into Android project structure
        cp bg_widget_oled.xml ic_concentric_logo.xml app/src/main/res/drawable/ 2>/dev/null || true
        cp colors.xml strings.xml themes.xml app/src/main/res/values/ 2>/dev/null || true
        cp widget_telemetry_info.xml app/src/main/res/xml/ 2>/dev/null || true
        cp widget_telemetry.xml app/src/main/res/layout/ 2>/dev/null || true
        cp MainActivity.kt app/src/main/java/com/aether/monitor/ 2>/dev/null || true
        cp AetherWidgetProvider.kt app/src/main/java/com/aether/monitor/widget/ 2>/dev/null || true
        cp index.html app/src/main/assets/www/ 2>/dev/null || true

        # Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_concentric_logo"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AetherOLED">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:theme="@style/Theme.AetherOLED">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <receiver
                    android:name=".widget.AetherWidgetProvider"
                    android:exported="true"
                    android:label="@string/widget_name">
                    <intent-filter>
                        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                        <action android:name="android.intent.action.BATTERY_CHANGED" />
                    </intent-filter>
                    <meta-data
                        android:name="android.appwidget.provider"
                        android:resource="@xml/widget_telemetry_info" />
                </receiver>
            </application>
        </manifest>
        EOF

        # Themes
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AetherOLED" parent="@android:style/Theme.NoTitleBar.Fullscreen">
                <item name="android:windowBackground">@color/oled_black</item>
                <item name="android:colorBackground">@color/oled_black</item>
                <item name="android:statusBarColor">@color/oled_black</item>
                <item name="android:navigationBarColor">@color/oled_black</item>
            </style>
        </resources>
        EOF

        # Widget info
        cat << 'EOF' > app/src/main/res/xml/widget_telemetry_info.xml
        <?xml version="1.0" encoding="utf-8"?>
        <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/widget_description"
            android:initialLayout="@layout/widget_telemetry"
            android:minWidth="250dp"
            android:minHeight="110dp"
            android:targetCellWidth="4"
            android:targetCellHeight="2"
            android:previewLayout="@layout/widget_telemetry"
            android:resizeMode="horizontal|vertical"
            android:updatePeriodMillis="1800000"
            android:widgetCategory="home_screen" />
        EOF

        # Gradle Configuration
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "AetherMonitor"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.aether.monitor"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.aether.monitor"
                minSdk = 26
                targetSdk = 34
                versionCode = 4
                versionName = "1.0.3"
            }

            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions { jvmTarget = "1.8" }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.webkit:webkit:1.10.0")
        }
        EOF

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle 8.5
      run: |
        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew

    - name: Build Android APK
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AETHER-OLED-Widget-APK
        path: app/build/outputs/apk/debug/app-debug.apk
