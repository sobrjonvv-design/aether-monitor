name: Build AETHER Android APK with Native Widget

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Assemble Android Project Structure
      run: |
        # 1. Очистка дубликатов файлов
        rm -f "build.gradle (1).kts" "index (2).html" "build-apk.yml"

        # 2. Создание правильной файловой структуры Android
        mkdir -p app/src/main/java/com/aether/monitor/widget
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets/www

        # 3. Раскладка файлов (без файлов с дефисами в названии)
        cp MainActivity.kt app/src/main/java/com/aether/monitor/
        cp AetherWidgetProvider.kt app/src/main/java/com/aether/monitor/widget/
        cp AndroidManifest.xml app/src/main/
        cp widget_telemetry.xml app/src/main/res/layout/
        cp widget_telemetry_info.xml app/src/main/res/xml/
        cp bg_widget_oled.xml ic_concentric_logo.xml app/src/main/res/drawable/
        cp colors.xml strings.xml themes.xml app/src/main/res/values/
        cp index.html app/src/main/assets/www/

        # 4. Конфигурация settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AetherMonitor"
        include(":app")
        EOF

        # 5. Конфигурация build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 6. Конфигурация gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official
        EOF

        # 7. Конфигурация app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.aether.monitor"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.aether.monitor"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.webkit:webkit:1.10.0")
        }
        EOF

        # 8. Автоматическое принятие лицензий Android SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle 8.5
      run: |
        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew

    - name: Build Android APK
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AETHER-OLED-Widget-APK
        path: app/build/outputs/apk/debug/app-debug.apk
